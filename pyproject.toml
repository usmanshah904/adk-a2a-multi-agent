[project]
name = "a2a-research-agents"
version = "1.0.0"
description = "Two Google ADK agents (Research and Summary) that collaborate over the A2A protocol."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Usman Shah" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    # Google ADK labels its A2A integration experimental; not an issue in this code.
    'ignore:\[EXPERIMENTAL\]:UserWarning',
    'ignore::DeprecationWarning',
    'ignore:Using `httpx` with `starlette.testclient`',
]
